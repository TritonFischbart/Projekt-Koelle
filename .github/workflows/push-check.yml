# Zeigt, ob die Push-Nachrichten funktionieren: eingeschaltete Geräte, Einstellungen,
# Protokoll des Versand-Dienstes der letzten 3 Tage. Nur per Hand ("Run workflow").
# Geräte-Adressen und andere lange Kennungen werden unkenntlich gemacht.
name: Push-Nachrichten prüfen

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zugang einrichten
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Geräte und Einstellungen
        working-directory: functions
        run: |
          npm install --no-audit --no-fund --silent
          node check-push.mjs

      - name: Protokoll des Versand-Dienstes (letzte 3 Tage)
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          echo "=== Zeitplan (stündlicher Job) ==="
          gcloud scheduler jobs list --project projekt-koelle --location europe-west3 \
            --format="table(name.basename(), schedule, state, lastAttemptTime, status.code)" || true
          echo
          echo "=== Protokoll ==="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name:"push" AND (severity>=WARNING OR textPayload:"PUSH" OR textPayload:"Error")' \
            --project projekt-koelle --freshness=3d --limit=200 --order=asc \
            --format='value(timestamp.date("%d.%m. %H:%M", tz="Europe/Berlin"), resource.labels.service_name, severity, textPayload)' \
            | sed -E 's/[A-Za-z0-9_:-]{60,}/[…]/g' || true

      - name: Zugang entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
